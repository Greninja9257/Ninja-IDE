<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Addon Settings - Ninja</title><link rel="icon" type="image/png" href="/ide/favicon.png"><style>body[data-splash-theme="dark"] {
        background: #111;
      }

      noscript {
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      }</style></head><body><noscript><h1>This page requires JavaScript</h1></noscript><script>(function() {
        var theme = '';

        try {
          var themeSetting = localStorage.getItem('tw:theme');
        } catch (e) {
          // ignore
        }
        if (themeSetting === 'light') {
          theme = 'light';
        } else if (themeSetting === 'dark') {
          theme = 'dark';
        } else if (themeSetting) {
          try {
            var parsed = JSON.parse(themeSetting);
            if (parsed.gui === 'dark' || parsed.gui === 'light') {
              theme = parsed.gui;
            }
          } catch (e) {
            // ignore
          }
        }

        if (!theme) {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }

        document.body.setAttribute('data-splash-theme', theme);
      })();</script><div id="app"></div><script src="/ide/js/pentapod/vendors~addon-settings~credits~editor~embed~fullscreen~player.87c85c4b008557568275.js"></script><script src="/ide/js/pentapod/addon-settings~addons~editor~fullscreen~player.7f092917032976ba6789.js"></script><script src="/ide/js/pentapod/addon-settings~editor~embed~fullscreen~player.561f9e1a50a368e2e9f1.js"></script><script src="/ide/js/pentapod/addon-settings.dc63beebfa884ba2f448.js"></script></body></html>
